            currentSites.push({
                id: crypto.randomUUID(),
                title: title,
                addrText: addrStr,
                colorCode: 2,            // 수동 추가는 기본 빨강
                poleNum: "",
                addrLatLng: { lat: latLng.getLat(), lng: latLng.getLng(), addrStr: addrStr },
                poleLatLng: null,
                isAbsent: false,
                memo: memo || ""
            });
            selectedKey = coordKey(latLng.getLat(), latLng.getLng());
            saveAndRender();
        });
    });

    /* ═══════════════════════════════════════════════════════════
       [통합 검색]
       └ 8자리 영문·숫자(숫자 포함): Enter로 인입주 조회
       └ 그 밖의 입력: 상호·주소 실시간 필터
    ═══════════════════════════════════════════════════════════ */
    function isPoleQuery(v) { return /^[0-9A-Za-z]{8}$/.test(v) && /[0-9]/.test(v); }

    $('q').addEventListener('input', function() {
        var v = this.value.trim(), pole = isPoleQuery(v);
        $('poleGo').hidden = !pole;
        quickSearchKeyword = pole ? "" : v.toLowerCase();
        drawMarkers();
    });

    $('searchForm').addEventListener('submit', function(ev) {
        ev.preventDefault();
        var v = $('q').value.trim();
        if (isPoleQuery(v)) searchPole(v.toUpperCase());
        else this.querySelector('input').blur();
    });

    /* ═══════════════════════════════════════════════════════════
       [인입주 단일 조회]
       └ 이미 목록에 있는 번호면 그 위치로 이동
       └ 없으면 4자리 prefix CSV 다운로드 후 추가
       └ 동일 번호 다중 결과면 참조 좌표 기준 최단거리 1건만 채택
    ═══════════════════════════════════════════════════════════ */
    async function searchPole(poleNum) {
        var existing = getFilteredSites().find(s => s.poleNum === poleNum);
        if (existing) { focusSite(existing); return; }

        toast("인입주 " + poleNum + " 검색 중입니다.");

        // 캐시 회피용 timestamp
        var url = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${poleNum.substring(0,4)}.csv?t=${Date.now()}`;

        try {
            var res = await fetch(url);
            if (!res.ok) { toast("인입주 " + poleNum + " 데이터를 찾지 못했습니다."); return; }

            var lines = (await res.text()).trim().split('\n');
            var found = [];

            // CSV: 0=인입주번호, 1=주소, 2=경도(lng), 3=위도(lat)
            for (var i = 1; i < lines.length; i++) {
                var cols = lines[i].split(',');
                if (cols[0] && cols[0].trim().toUpperCase() === poleNum) {
                    var lng = parseFloat(cols[2]), lat = parseFloat(cols[3]);
                    if (!isNaN(lat) && !isNaN(lng)) {
                        found.push({ meshno: cols[0].trim(), addr: cols[1] ? cols[1].trim() : "주소 없음", lng, lat });
                    }
                }
            }

            if (!found.length) { toast("인입주 번호 " + poleNum + "를 찾지 못했습니다."); return; }

            // 다중 결과 → 참조 좌표 기준 최단거리 1건
            var ref = getReferenceCoord();
            if (ref) {
                found.sort((a,b) => getDistance(ref.lat,ref.lng,a.lat,a.lng) - getDistance(ref.lat,ref.lng,b.lat,b.lng));
                found = [found[0]];
            }

            found.forEach(function(f) {
                currentSites.push({
                    id: crypto.randomUUID(),
                    title: "전주: " + f.meshno,
                    addrText: f.addr,
                    colorCode: 7,
                    poleNum: f.meshno,
                    addrLatLng: null,
                    poleLatLng: { lat: f.lat, lng: f.lng, addrStr: f.addr },
                    isAbsent: false,
                    memo: "인입주 단일 검색 추가"
                });
            });

            // 검색 결과 보이도록 혼합 모드로 강제 전환
            searchTypeFilter = 'mixed';
            saveSettings();
            selectedKey = coordKey(found[0].lat, found[0].lng);
            saveAndRender();

            // 카메라 이동
            map.setCenter(new kakao.maps.LatLng(found[0].lat, found[0].lng));
            map.setLevel(2);
            toast(ref ? "가장 가까운 인입주를 찾았습니다." : "인입주를 찾았습니다.");
        } catch(e) {
            toast("조회하지 못했습니다. 네트워크를 확인해 주세요.");
        }
    }

    /* ═══════════════════════════════════════════════════════════
       [엑셀 업로드 → 일괄 등록]
       1) A:상호  B:주소  C:색상코드  D:인입주
       2) 주소 → 좌표 (40ms 간격 throttling)
       3) 인입주 prefix별 CSV 다운로드 → poleDict 구성
       4) 각 사이트에 좌표 매핑
       5) 표시 후 bounds로 카메라 핏
    ═══════════════════════════════════════════════════════════ */
    $('upload-btn').onclick = function() {
        var file = $('excel-file').files[0];
        $('fileErr').hidden = !!file;
        if (!file) return;
        $('dlgSettings').close();

        var reader = new FileReader();
        reader.onload = async function(e) {
            // ─ (1) 엑셀 → JSON ─
            var wb   = XLSX.read(new Uint8Array(e.target.result), { type:'array' });
            var json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1 });
            var rows = json.slice(1).filter(r => r[0] || r[1] || r[3]); // 헤더 제외, 빈 행 제거
            if (!rows.length) { toast("파일에 유효한 데이터가 없습니다."); return; }

            toast("주소를 변환하고 있습니다.");

            // ─ (2) 사이트 객체 생성 ─
            var newSites = rows.map(r => ({
                id:        crypto.randomUUID(),
                title:     r[0] ? r[0].toString() : '이름없음',
                addrText:  r[1] ? r[1].toString().trim() : '',
                colorCode: r[2] || 1,
                poleNum:   r[3] ? r[3].toString().toUpperCase().trim() : '',
                addrLatLng: null,
                poleLatLng: null,
                isAbsent: false,
                memo: ""
            }));

            // ─ (3) 주소 지오코딩 (병렬, 40ms 간격) ─
            //   카카오 geocoder 부하 방지용 throttling
            await Promise.all(newSites.map((site, idx) => new Promise(resolve => {
                if (!site.addrText) return resolve();
                setTimeout(() => {
                    geocoder.addressSearch(site.addrText, function(result, status) {
                        if (status === kakao.maps.services.Status.OK && result.length > 0) {
                            var a = result[0];
                            // 정확한 번지/건물번호가 있을 때만 인정 (도로명 우선)
                            var exact = (a.road_address && a.road_address.main_building_no)
                                     || (a.address      && a.address.main_address_no);
                            if (exact) site.addrLatLng = { lat: parseFloat(a.y), lng: parseFloat(a.x), addrStr: site.addrText };
                        }
                        resolve();
                    });
                }, idx * 40);
            })));

            // ─ (4) 인입주 백업 좌표 다운로드 ─
            toast("인입주 정보를 내려받고 있습니다.");
            var polePrefixes = [...new Set(
                newSites.filter(s => s.poleNum && s.poleNum.length === 8).map(s => s.poleNum.substring(0,4))
            )];
            var poleDict = {}; // { 인입주번호: [{lat,lng,addr}, ...] }

            for (var i = 0; i < polePrefixes.length; i++) {
                try {
                    var r = await fetch(`https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${polePrefixes[i]}.csv?t=${Date.now()}`);
                    if (r.ok) {
                        (await r.text()).trim().split('\n').slice(1).forEach(line => {
                            var cols = line.split(',');
                            if (cols.length >= 4 && cols[0]) {
                                var pn  = cols[0].trim().toUpperCase(),
                                    lng = parseFloat(cols[2]),
                                    lat = parseFloat(cols[3]);
                                if (!isNaN(lat) && !isNaN(lng)) {
                                    if (!poleDict[pn]) poleDict[pn] = [];
                                    poleDict[pn].push({ lat, lng, addr: cols[1] ? cols[1].trim() : "NDIS 주소 없음" });
                                }
                            }
                        });
                    }
                } catch(e) { /* 일부 실패해도 진행 */ }
            }

            // ─ (5) 동일 인입주번호 중 가장 가까운 좌표 채택 ─
            //   참조: 내 위치 우선 → 없으면 주소 매칭된 것들의 평균
            var ref = getMyCoord();
            if (!ref) {
                var va = newSites.filter(s => s.addrLatLng);
                if (va.length) {
                    var sl=0, sg=0;
                    va.forEach(s => { sl += s.addrLatLng.lat; sg += s.addrLatLng.lng; });
                    ref = { lat: sl/va.length, lng: sg/va.length };
                }
            }
            newSites.forEach(site => {
                if (site.poleNum && poleDict[site.poleNum]?.length) {
                    var m = poleDict[site.poleNum];
                    if (ref) m.sort((a,b) => getDistance(ref.lat,ref.lng,a.lat,a.lng) - getDistance(ref.lat,ref.lng,b.lat,b.lng));
                    site.poleLatLng = { lat: m[0].lat, lng: m[0].lng, addrStr: m[0].addr };
                }
            });

            // ─ (6) 적용 + 화면 핏 ─
            currentSites = newSites;
            selectedKey = null;
            quickSearchKeyword = "";
            $('q').value = "";
            $('poleGo').hidden = true;
            saveAndRender();

            var actives = getFilteredSites();
            if (actives.length) {
                var bounds = new kakao.maps.LatLngBounds();
                actives.forEach(s => bounds.extend(new kakao.maps.LatLng(s.lat, s.lng)));
                setTimeout(() => map.setBounds(bounds, 40, 40, 40, 40), 200);
            }
            toast(actives.length + "건을 지도에 표시했습니다.");
        };
        reader.readAsArrayBuffer(file);
    };

    /* ═══════════════════════════════════════════════════════════
       [디바이스 방향(나침반) → 화살표 회전]
       └ iOS Safari: webkitCompassHeading
       └ Android: deviceorientation의 alpha 사용
    ═══════════════════════════════════════════════════════════ */
    function handleOrientation(event) {
        var heading = null;
        if (event.webkitCompassHeading !== undefined) {
            heading = event.webkitCompassHeading;
        } else if (event.alpha !== null) {
            heading = 360 - event.alpha;
        }

        if (heading !== null) {
            var arr = $('direction-arrow');
            if (arr) {
                arr.style.display   = 'block';
                arr.style.transform = 'rotate(' + heading + 'deg)';
            }
        }
    }

    /* ═══════════════════════════════════════════════════════════
       [위치 추적 시작/중단]
    ═══════════════════════════════════════════════════════════ */
    function stopTracking() {
        if (watchId !== null) navigator.geolocation.clearWatch(watchId);
        watchId = null;
        window.removeEventListener('deviceorientationabsolute', handleOrientation, true);
        window.removeEventListener('deviceorientation',         handleOrientation, true);

        if (myLocMarker) { myLocMarker.setMap(null); myLocMarker = null; }
        $('optTrack').checked = false;
        $('my-loc-fab').classList.remove('active');
        renderPanel(getFilteredSites());
        renderCard();
    }

    function startTracking() {
        if (!navigator.geolocation) { toast("위치 정보가 지원되지 않는 환경입니다."); $('optTrack').checked = false; return; }

        // iOS 13+는 권한 요청 필요
        if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
            DeviceOrientationEvent.requestPermission().then(res => {
                if (res === 'granted') window.addEventListener('deviceorientation', handleOrientation, true);
            }).catch(function() {});
        } else {
            window.addEventListener('deviceorientationabsolute', handleOrientation, true);
            window.addEventListener('deviceorientation',         handleOrientation, true);
        }

        watchId = navigator.geolocation.watchPosition(function(pos) {
            var loc = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
            var isFirst = !myLocMarker;
            ensureMyLocMarker(loc);
            if (isFirst) map.setCenter(loc); // 처음 잡힐 때만 카메라 이동
            renderPanel(getFilteredSites());  // 거리·순서 갱신
            renderCard();
        }, function() {
            toast("위치 정보를 가져올 수 없습니다. 권한을 확인해 주세요.");
            stopTracking();
        }, { enableHighAccuracy: true });

        $('optTrack').checked = true;
        $('my-loc-fab').classList.add('active');
    }

    $('optTrack').onchange = function() {
        if (this.checked) startTracking(); else stopTracking();
    };

    /* ═══════════════════════════════════════════════════════════
       [내 위치 FAB] 한 번 클릭 시 카메라 이동, 추적 안 켜져있으면 자동 시작
    ═══════════════════════════════════════════════════════════ */
    $('my-loc-fab').onclick = function() {
        if (!navigator.geolocation) { toast("위치 정보가 지원되지 않는 환경입니다."); return; }

        // 이미 추적 중이면 마지막 위치로 카메라만 이동
        if (watchId !== null && myLocMarker) {
            map.setCenter(myLocMarker.getPosition());
            map.setLevel(4);
            return;
        }

        // 아직 추적 중이 아니면 시작 (iOS 권한 요청은 클릭 안에서 해야 한다)
        if (watchId === null) startTracking();

        navigator.geolocation.getCurrentPosition(function(pos) {
            var loc = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
            map.setCenter(loc);
            map.setLevel(4);
            ensureMyLocMarker(loc);
            renderPanel(getFilteredSites());
            renderCard();
        }, function() {
            toast("위치 정보를 가져올 수 없습니다. 권한을 확인해 주세요.");
        }, { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 });
    };

    /* ═══════════════════════════════════════════════════════════
       [라벨 HTML 생성]
       └ 너무 길면 끝 3토큰만 사용
    ═══════════════════════════════════════════════════════════ */
    function buildLabelHtml(labelText) {
        if (!isLabelOn || !labelText) return '';
        // 끝의 영문 토큰 제거 후 마지막 3단어만 추출
        var cleaned = labelText.replace(/(\s+[a-zA-Z]+)+$/g, '').trim();
        var parts   = cleaned.split(/\s+/);
        var short   = parts.length > 3 ? parts.slice(-3).join(' ') : cleaned;
        return `<div class="marker-label">${escapeHtml(short)}</div>`;
    }

    /* ═══════════════════════════════════════════════════════════
       [마커 SVG 생성]
       └ pole(인입주): 다이아몬드 모양 / address(주소): 둥근 핀
       └ 부재: 속이 빈 핀 (색이 아니라 모양으로 구분)
    ═══════════════════════════════════════════════════════════ */
    function buildMarkerSvg(isPole, color, isAbsent, w, h) {
        var fill   = isAbsent ? '#ffffff' : color;
        var stroke = isAbsent ? '#14202e' : '#ffffff';
        var inner  = isAbsent ? '#14202e' : '#ffffff';
        var d = isPole ? 'M6 2h12l5 9-11 18L1 11Z'
                       : 'M12 1C6 1 1.5 5.6 1.5 11.4 1.5 19 12 29 12 29s10.5-10 10.5-17.6C22.5 5.6 18 1 12 1Z';
        return `<svg width="${w}" height="${h}" viewBox="0 0 24 30" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">` +
               `<path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="2"/>` +
               `<circle cx="12" cy="11" r="3.5" fill="${inner}"/></svg>`;
    }

    /* ═══════════════════════════════════════════════════════════
       [마커 객체 빌드]
       └ 같은 좌표(소수점 6자리)에 여러 사이트가 겹치면 그룹화
       └ 각 그룹당 1개 마커, 클릭 시 선택 카드에 모두 나열
    ═══════════════════════════════════════════════════════════ */
    function buildMarkerObjects(sites) {
        // 1) 동일 좌표끼리 그룹화
        var groups = {};
        sites.forEach(function(s) {
            if (s.lat == null || s.lng == null || isNaN(s.lat) || isNaN(s.lng)) return;
            var key = coordKey(s.lat, s.lng);
            if (!groups[key]) groups[key] = [];
            groups[key].push(s);
        });

        // 2) 각 그룹 → 1개의 Marker. 이번에 없는 좌표의 마커는 버린다
        Object.keys(markerCache).forEach(function(k) { if (!groups[k]) delete markerCache[k]; });
        return Object.keys(groups).map(function(key) {
            var group     = groups[key];
            var first     = group[0];
            var hasAbsent = group.some(s => s.isAbsent);
            var mColor    = colorMap[first.colorCode] || "#0055AA";
            var isPole    = first.viewMode === 'pole';

            // 라벨: 매칭주소 → 원본주소 → 제목 순
            var labelHtml = buildLabelHtml(first.addr || first.addrText || first.title || '');
            var svgInner  = buildMarkerSvg(isPole, mColor, hasAbsent, MARKER_W, MARKER_H);

            // 모양이 그대로인 핀은 지난번 마커를 다시 쓴다 (천 개가 넘으면 새로 만드는 데 오래 걸린다)
            var sig = [first.lat, first.lng, labelHtml, mColor, hasAbsent, isPole].join('|');
            if (markerCache[key] && markerCache[key].sig === sig) return markerCache[key].marker;

            // 마커 컨테이너 (라벨 + 아이콘)
            var markerContent = document.createElement('div');
            markerContent.style.cssText = "position:relative;display:inline-block;text-align:center;cursor:pointer;";
            markerContent.innerHTML = `
                ${labelHtml}
                <img src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(svgInner)}" alt=""
                     style="width:${MARKER_W}px;height:${MARKER_H}px;display:block;" />
            `;
            markerContent.onclick = function() { selectLocation(key); };

            // CustomOverlay (yAnchor:1 → 핀 끝이 좌표에 닿게, clickable → 지도 클릭으로 전파 안 함)
            var m = new kakao.maps.CustomOverlay({
                position: new kakao.maps.LatLng(first.lat, first.lng),
                content: markerContent,
                yAnchor: 1,
                zIndex: 1,     // 내 위치 표시(0)보다 위
                clickable: true
            });
            markerCache[key] = { sig: sig, marker: m };
            return m;
        });
    }

    /* ═══════════════════════════════════════════════════════════
       [목록·요약] 내 위치가 있으면 가까운 순, 없으면 파일 순서
    ═══════════════════════════════════════════════════════════ */
    /** 정렬 기준 글자 (없으면 빈 값 → 맨 뒤로) */
    function sortText(s) {
        if (sortMode === 'address') return s.addr || s.addrText || '';
        if (sortMode === 'pole')    return s.poleNum || '';
        return s.title || '';
    }

    function sortRows(rows) {
        var dir = sortDesc ? -1 : 1;
        if (sortMode === 'default') {
            if (rows.length && rows[0].km != null) rows.sort((a, b) => (a.km - b.km) * dir);
            else if (sortDesc) rows.reverse();
            return;
        }
        rows.sort(function(a, b) {
            var x = sortText(a.site), y = sortText(b.site);
            if (!x !== !y) return x ? -1 : 1;
            return x.localeCompare(y, 'ko', { numeric: true, sensitivity: 'base' }) * dir;
        });
    }

    $('sortSel').onchange = function() {
        sortMode = this.value;
        saveSettings();
        renderPanel(getFilteredSites());
        $('list').scrollTop = 0;
    };

    $('sortDir').onclick = function() {
        sortDesc = !sortDesc;
        saveSettings();
        renderPanel(getFilteredSites());
        $('list').scrollTop = 0;
    };

    function renderPanel(filtered) {
        var me = getMyCoord();
        var rows = filtered.map(s => ({ site: s, km: me ? getDistance(me.lat, me.lng, s.lat, s.lng) : null }));
        sortRows(rows);

        var ul = $('list');
        var listShown = !isPhone() || document.body.classList.contains('list-open');
        var scroll = ul.scrollTop;
        ul.textContent = '';
        if (!listShown) rows = [];

        if (listShown && !rows.length) {
            var li = el('li', 'empty');
            if (currentSites.length) {
                li.textContent = '조건에 맞는 점검지가 없습니다. 검색어나 필터를 바꿔 보세요.';
            } else {
                li.append('점검 목록 엑셀을 올리거나, 지도를 우클릭 또는 길게 눌러 핀을 추가하세요.');
                var open = el('button', 'btn primary', '엑셀 파일 올리기');
                open.onclick = openSettings;
                li.append(open);
            }
            ul.append(li);
        }

        rows.forEach(function(r) {
            var s = r.site, key = coordKey(s.lat, s.lng);
            var li = el('li'), b = el('button', 'row');
            b.setAttribute('aria-current', key === selectedKey);
            b.insertAdjacentHTML('beforeend', buildMarkerSvg(s.viewMode === 'pole', colorMap[s.colorCode] || "#0055AA", s.isAbsent, 16, 20));
            var t = el('span', 't', s.title);
            if (s.isAbsent) t.append(el('span', 'tag', '부재'));
            b.append(t, el('span', 'd num', r.km == null ? '–' : formatDistance(r.km)), el('span', 'a', s.addr || s.addrText || ''));
            b.onclick = function() { focusSite(s); };
            li.append(b);
            ul.append(li);
        });
        ul.scrollTop = scroll;

        var absentN = filtered.filter(s => s.isAbsent).length;
        var sumL = $('sumL');
        sumL.textContent = '표시 ';
        sumL.append(el('b', 'num', filtered.length + '건'), ' · 전체 ' + currentSites.length + '건 · 부재 ' + absentN + '건');
        $('sortDefault').textContent = me ? '가까운 순' : '파일 순서';
        $('sortDir').textContent = sortDesc ? '↓ 내림차순' : '↑ 오름차순';
        $('listTitle').textContent = '목록 ' + filtered.length + '건';
        $('peekL').textContent = '표시 ' + filtered.length + '건 · 부재 ' + absentN + '건';
        $('pmCount').textContent = $('peekL').textContent;
    }

    /* ═══════════════════════════════════════════════════════════
       [선택] 위치 선택 → 지도 표시 + 카드
    ═══════════════════════════════════════════════════════════ */
    function focusSite(s) {
        document.body.classList.remove('list-open');
        selectLocation(coordKey(s.lat, s.lng));
        var pos = new kakao.maps.LatLng(s.lat, s.lng);
        if (map.getLevel() > 2) map.setLevel(2);
        map.setCenter(pos);
        // 휴대폰에서 카드가 나타나 지도 크기가 바뀐 뒤 다시 맞춘다
        setTimeout(function() { map.setCenter(pos); }, 60);
    }

    function selectLocation(key) {
        selectedKey = key;
        editingMemoId = null;
        renderSelection();
        renderPanel(getFilteredSites());
        renderCard();
    }

    function renderSelection() {
        var site = selectedKey ? getFilteredSites().find(s => coordKey(s.lat, s.lng) === selectedKey) : null;
        if (!site) {
            if (selectedRing) selectedRing.setMap(null);
            return;
        }
        var pos = new kakao.maps.LatLng(site.lat, site.lng);
        if (!selectedRing) {
            selectedRing = new kakao.maps.CustomOverlay({
                position: pos, map: map, zIndex: 0, xAnchor: 0.5, yAnchor: 0.85,
                content: '<div class="selected-ring"></div>'
            });
        } else {
            selectedRing.setPosition(pos);
            selectedRing.setMap(map);
        }
    }

    /* ═══════════════════════════════════════════════════════════
       [삭제 + 되돌리기] 점검완료 / 위치 일괄 삭제 공용
    ═══════════════════════════════════════════════════════════ */
    function removeSites(ids, message) {
        var before = currentSites.slice(), prevKey = selectedKey;
        currentSites = currentSites.filter(s => !ids.has(s.id));
        if (!getFilteredSites().some(s => coordKey(s.lat, s.lng) === selectedKey)) selectedKey = null;
        editingMemoId = null;
        saveAndRender();
        toast(message, function() {
            currentSites = before;
            selectedKey = prevKey;
            saveAndRender();
        });
    }

    /* ═══════════════════════════════════════════════════════════
       [선택 카드] 같은 위치의 사이트를 모두 나열
    ═══════════════════════════════════════════════════════════ */
    function renderCard() {
        var card  = $('card');
        var group = selectedKey ? getFilteredSites().filter(s => coordKey(s.lat, s.lng) === selectedKey) : [];
        card.textContent = '';
        card.hidden = !group.length;
        if (!group.length) return;

        var me = getMyCoord();
        var top = el('div', 'card-top');
        var titleText = group[0].title + (group.length > 1 ? ' 외 ' + (group.length - 1) + '건' : '');
        var close = el('button', 'x', '×');
        close.setAttribute('aria-label', '닫기');
        close.onclick = function() { selectLocation(null); };
        top.append(el('h2', '', titleText));
        if (group.length > 1) {
            var bulk = el('button', 'btn bulk', group.length + '건 모두 완료');
            bulk.onclick = function() { removeSites(new Set(group.map(g => g.id)), `이 위치 ${group.length}건을 삭제했습니다.`); };
            top.append(bulk);
        }
        top.append(close);
        card.append(top);

        group.forEach(function(item) {
            var box = el('div', 'item');
            if (group.length > 1) box.append(el('h3', '', item.title));
            var distText = me ? ' · ' + formatDistance(getDistance(me.lat, me.lng, item.lat, item.lng)) : '';
            box.append(el('div', 'meta', (item.addr || '') + distText));
            if (item.poleNum) {
                var p = el('div', 'meta');
                p.append('인입주 ', el('b', 'num', item.poleNum));
                box.append(p);
            }

            /* ─── 메모 표시/편집 ─── */
            if (editingMemoId === item.id) {
                var ta = el('textarea');
                ta.value = item.memo || '';
                ta.setAttribute('aria-label', '메모');
                var save = el('button', 'btn tint memo-save', '메모 저장');
                save.onclick = function() {
                    var ri = currentSites.find(s => s.id === item.id);
                    if (ri) { ri.memo = ta.value.trim(); saveAndRender(false); }
                    editingMemoId = null;
                    renderCard();
                };
                box.append(ta, save);
                setTimeout(function() { ta.focus(); }, 0);
            } else {
                var memo = el('button', 'memo' + (item.memo ? ' has' : ''), item.memo || '메모 추가');
                memo.onclick = function() { editingMemoId = item.id; renderCard(); };
                box.append(memo);
            }

            /* ─── 부재 체크박스 ─── */
            var lab = el('label', 'absent'), chk = el('input');
            chk.type = 'checkbox';
            chk.checked = item.isAbsent || false;
            chk.onchange = function() {
                var ri = currentSites.find(s => s.id === item.id);
                if (ri) { ri.isAbsent = chk.checked; saveAndRender(true); }
            };
            lab.append(chk, '미점검 (부재)');
            box.append(lab);

            /* ─── 길찾기 / 로드뷰 / 점검완료 ─── */
            var acts = el('div', 'acts');
            var n = el('a', 'btn primary', '길찾기');
            n.href = `https://map.kakao.com/link/to/${encodeURIComponent(item.title)},${item.lat},${item.lng}`;
            n.target = "_blank"; n.rel = "noopener";
            var rv = el('a', 'btn', '로드뷰');
            rv.href = `https://map.kakao.com/link/roadview/${item.lat},${item.lng}`;
            rv.target = "_blank"; rv.rel = "noopener";
            var d = el('button', 'btn tint', '점검완료');
            d.onclick = function() { removeSites(new Set([item.id]), `'${item.title}' 점검완료로 삭제했습니다.`); };
            acts.append(n, rv, d);
            box.append(acts);
            card.append(box);
        });

    }

    /* ═══════════════════════════════════════════════════════════
       [전체 다시 그리기]
       └ 기존 클러스터러/마커 모두 제거 → 필터 적용 → 재배치
    ═══════════════════════════════════════════════════════════ */
    function drawMarkers() {
        // 기존 클러스터러/마커 정리
        clusterer.clear();
        renderedMarkers.forEach(m => m.setMap(null));
        renderedMarkers = [];

        var filtered = getFilteredSites();
        var markers  = buildMarkerObjects(filtered);

        if (isClusteringOn) {
            clusterer.addMarkers(markers);
        } else {
            // 클러스터링 OFF면 마커 직접 표시, renderedMarkers에 보관(다음 clear용)
            markers.forEach(m => m.setMap(map));
            renderedMarkers = markers;
        }

        renderChips();
        renderPanel(filtered);
        renderFailedListUI();
        renderSelection();
        renderCard();
    }

    /** 데이터 영속화 + (옵션) 재렌더링 */
    function saveAndRender(reDraw = true) {
        try { localStorage.setItem('kesco_map_data', JSON.stringify(currentSites)); } catch(e) {}
        if (reDraw) drawMarkers();
    }

    /* ═══════════════════════════════════════════════════════════
       [표시·파일 대화상자 / 휴대폰 목록 시트]
    ═══════════════════════════════════════════════════════════ */
    function openSettings() {
        document.body.classList.remove('list-open');
        $('fileErr').hidden = true;
        $('dlgSettings').showModal();
    }
    function isPhone() { return matchMedia('(max-width: 900px)').matches; }
    function setPhoneMenu(open) {
        $('phoneMenu').hidden = !open;
        document.body.classList.toggle('menu-open', open);
        $('openSettings').setAttribute('aria-expanded', open);
    }
    function setFilters(open) {
        document.body.classList.toggle('filters-open', open);
        $('filterBtn').setAttribute('aria-expanded', open);
    }
    $('openSettings').onclick = function() {
        if (!isPhone()) { openSettings(); return; }
        var open = $('phoneMenu').hidden;
        setPhoneMenu(open);
        if (open) setFilters(false);
    };
    $('filterBtn').onclick = function() {
        var open = !document.body.classList.contains('filters-open');
        setFilters(open);
        if (open) setPhoneMenu(false);
    };
    function openList() { document.body.classList.add('list-open'); renderPanel(getFilteredSites()); }
    $('pmList').onclick     = function() { setPhoneMenu(false); openList(); };
    $('pmSettings').onclick = function() { setPhoneMenu(false); openSettings(); };
    $('pmFail').onclick     = function() { setPhoneMenu(false); $('failBtn').click(); };
    $('closeSettings').onclick = function() { $('dlgSettings').close(); };
    $('peek').onclick      = openList;
    $('closeList').onclick = function() { document.body.classList.remove('list-open'); };

    /* ═══════════════════════════════════════════════════════════
       [전체 초기화] 데이터 + 설정 모두 삭제 후 새로고침
    ═══════════════════════════════════════════════════════════ */
    $('clear-btn').onclick = function() { $('dlgReset').showModal(); };
    $('resetNo').onclick   = function() { $('dlgReset').close(); };
    $('resetYes').onclick  = function() {
        localStorage.removeItem('kesco_map_data');
        localStorage.removeItem('kesco_settings');
        location.reload();
    };
</script>
</body>
</html>
